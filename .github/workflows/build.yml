name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Version ribbon on the banner / icons (e.g. v2.1.15)
      - name: Stamp version on icons
        run: |
          pip install pillow --break-system-packages -q || pip install pillow -q
          python3 tools/stamp_icon.py "v2.1.${{ github.run_number }}"

      # The signing key lives only in GitHub Secrets (KEYSTORE_B64 + KEYSTORE_PASSWORD)
      - name: Prepare signing key
        id: key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::warning::Signing secrets missing - compile check only, nothing is published"
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
          echo "have=true" >> "$GITHUB_OUTPUT"

      - name: Compile check (no key)
        if: steps.key.outputs.have != 'true'
        run: gradle assembleDebug --stacktrace

      - name: Build signed release APK
        if: steps.key.outputs.have == 'true'
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.have == 'true'
        with:
          name: MawaqitHome-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Stable download link + the info the in-app updater reads (versionCode=N in the notes)
      - name: Publish latest APK as a release
        if: steps.key.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk MawaqitHome.apk
          CODE=$((100 + ${{ github.run_number }}))
          gh release delete latest --cleanup-tag -y || true
          gh release create latest MawaqitHome.apk \
            --title "Mawaqit Home v2.1.${{ github.run_number }}" \
            --notes "versionCode=${CODE}
          versionName=2.1.${{ github.run_number }}
          commit=${{ github.sha }}"
